name: Deploy DevOps App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "905542450009"
  ECR_REPOSITORY: devops-app
  ECS_CLUSTER: lacrei-desafio-cluster
  STAGING_SERVICE: lacrei-desafio-devops-app-staging
  PRODUCTION_SERVICE: lacrei-desafio-devops-app-production
  STAGING_TASK_FAMILY: lacrei-desafio-devops-app-staging
  PRODUCTION_TASK_FAMILY: lacrei-desafio-devops-app-production

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via restricted OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install dependencies, lint and test
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build image
        working-directory: app
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker run -d --name smoke-test -p 3000:3000 \
            -e APP_PREFIX=/devops/staging "$IMAGE_URI"
          trap 'docker rm -f smoke-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/devops/staging/status && exit 0
            sleep 2
          done
          docker logs smoke-test
          exit 1

      - name: Push immutable image if absent
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "Image already exists; reusing immutable SHA tag."
          else
            docker push "$IMAGE_URI"
          fi

      - name: Update staging ECS service
        env:
          ECS_SERVICE: ${{ env.STAGING_SERVICE }}
          TASK_FAMILY: ${{ env.STAGING_TASK_FAMILY }}
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: ./scripts/deploy-ecs.sh

      - name: Validate staging
        run: |
          for i in $(seq 1 15); do
            curl -sf "${{ vars.STAGING_URL }}" && exit 0
            sleep 15
          done
          exit 1

  promote-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via restricted OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify validated image exists
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ needs.deploy-staging.outputs.image_tag }}"

      - name: Update production ECS service with same SHA
        env:
          ECS_SERVICE: ${{ env.PRODUCTION_SERVICE }}
          TASK_FAMILY: ${{ env.PRODUCTION_TASK_FAMILY }}
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ needs.deploy-staging.outputs.image_tag }}
        run: ./scripts/deploy-ecs.sh

      - name: Validate production
        run: |
          for i in $(seq 1 15); do
            curl -sf "${{ vars.PRODUCTION_URL }}" && exit 0
            sleep 15
          done
          exit 1
