name: Deploy DevOps App

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Terraform/**"
      - ".github/workflows/deploy.yml"

# Necessario para o step de OIDC conseguir pedir o token de identidade
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        working-directory: app
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform init
        working-directory: Terraform
        run: terraform init

      - name: Terraform apply
        working-directory: Terraform
        env:
          TF_VAR_devops_image_tag: ${{ github.sha }}
          TF_VAR_my_ip: "0.0.0.0/32"
        run: terraform apply -auto-approve

      - name: Validar deploy
        run: |
          ALB_DNS=$(cd Terraform && terraform output -raw alb_dns_name)
          for i in $(seq 1 15); do
            if curl -sf "http://$ALB_DNS/devops/status"; then
              echo "Health check OK na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 15s..."
            sleep 15
          done
          echo "Health check falhou apos todas as tentativas"
          exit 1
